syntax = "proto3";

package butterroll.v1;

option go_package = "butter-roll/server/gen/butterroll/v1;butterrollv1";

// ── Domain types ─────────────────────────────────────────────────────────────

// Token is one piece on the map. X/Y are world-space coordinates.
// color and border_width are `optional` so "unset" (fall back to the client
// default) is distinguishable from an explicit 0 / empty value.
message Token {
  string id = 1;
  string url = 2;
  double x = 3;
  double y = 4;
  optional string color = 5;
  optional int32 border_width = 6;
  repeated string status_effects = 7;
  string name = 8;
  bool show_name = 9;
  bool public = 10;
  string monster = 11;
  optional int32 hp = 12;
  optional int32 wounds = 13;
  // owner_player_id ties a token to a durable player identity (the browser's
  // playerId), surviving reconnects and restarts. Set on a player's character
  // token and on any monster they own (familiar, summon). Unset = DM/NPC token.
  optional string owner_player_id = 14;
  // player marks the owner's own character token (backed by their sheet), as
  // distinct from an owned monster (player == false). At most one player == true
  // token per owner per page.
  bool player = 15;
  // character_id ties a player token to the specific character it represents (a
  // player owns a roster; see Character). Lets clients tell an active
  // character's token from a retired one's leftover token. Empty on non-player
  // (DM/NPC/monster) tokens.
  string character_id = 16;
  // pinned surfaces a DM/NPC token as a quick-access chip in the DM top bar,
  // alongside the player token chips. Set from the token's right-click menu.
  bool pinned = 17;
}

// FogPoly is one revealed polygon cut out of the fog overlay. points is a flat
// list of world-space coordinates [x0,y0, x1,y1, ...] with at least 3 vertices.
message FogPoly {
  string id = 1;
  repeated double points = 2;
}

// HexGrid is the DM's per-page hex overlay used to reveal fog one cell at a
// time. width/height are the bounding box of one hex in world pixels; offset is
// the world position of hex (0, 0)'s center. Unset on a page means not calibrated.
message HexGrid {
  enum Orientation {
    POINTY = 0;
    FLAT = 1;
  }
  Orientation orientation = 1;
  double width = 2;
  double height = 3;
  double offset_x = 4;
  double offset_y = 5;
}

// Page is a single map scene.
message Page {
  string id = 1;
  string name = 2;
  string map_url = 3;
  int32 map_width = 4;
  int32 map_height = 5;
  repeated Token tokens = 6;
  repeated FogPoly fog_polys = 7;
  HexGrid hex_grid = 8;
}

// ── Server → client messages ─────────────────────────────────────────────────

message Hello {
  string client_id = 1;
}

message Snapshot {
  string presented_page_id = 1;
  repeated Page pages = 2;
  repeated Character characters = 3;
}

// Character holds a player's sheet as an opaque JSON blob. The server stores and
// relays it (so the DM can view it and it survives restarts) but does not
// interpret its contents. name and token_url mirror the player's chosen display
// name and token image so clients (the DM's player bar) can show the player even
// on pages where they have no token.
//
// The store is keyed by character_id. An active character (archived == false)
// is owned by a player (player_id); switching characters archives the old one,
// which clears player_id — retired sheets live in a shared graveyard belonging
// to no individual player, so they survive that player being evicted.
message Character {
  string player_id = 1;
  string data = 2;
  string token_url = 3;
  string name = 4;
  string color = 5;  // border/dice color, so the DM can place their token
  string character_id = 6;  // durable per-character id; the store key
  bool archived = 7;        // false = the player's one active character
}

// ── Client → server messages (re-broadcast to all clients) ───────────────────

message MapSet {
  string page_id = 1;
  string url = 2;
  int32 width = 3;
  int32 height = 4;
}

message MapResize {
  string page_id = 1;
  int32 width = 2;
  int32 height = 3;
}

message TokenAdd {
  string page_id = 1;
  Token token = 2;
}

message TokenMove {
  string page_id = 1;
  string id = 2;
  double x = 3;
  double y = 4;
}

message TokenMoveBatch {
  string page_id = 1;
  repeated TokenMovePos moves = 2;
}

message TokenMovePos {
  string id = 1;
  double x = 2;
  double y = 3;
}

message TokenRemove {
  string page_id = 1;
  string id = 2;
}

// Partial update: every field is optional; only the set ones are applied.
message TokenUpdate {
  string page_id = 1;
  string id = 2;
  optional string color = 3;
  optional int32 border_width = 4;
  optional string name = 5;
  optional bool show_name = 6;
  optional bool public = 7;
  optional string monster = 8;
  optional int32 hp = 9;
  optional int32 wounds = 10;
  optional bool pinned = 11;
}

message TokenStatus {
  string page_id = 1;
  string id = 2;
  repeated string status_effects = 3;
}

message FogAdd {
  string page_id = 1;
  string id = 2;
  repeated double points = 3;
}

message FogRemove {
  string page_id = 1;
  string id = 2;
}

message HexGridSet {
  string page_id = 1;
  HexGrid hex_grid = 2;
}

message HexGridRemove {
  string page_id = 1;
}

message FogClear {
  string page_id = 1;
}

message PageAdd {
  string id = 1;
  string name = 2;
}

message PageRemove {
  string id = 1;
}

message PageRename {
  string id = 1;
  string name = 2;
}

message PagePresent {
  string id = 1;
}

message ArrowUpdate {
  string page_id = 1;
  double x1 = 2;
  double y1 = 3;
  double x2 = 4;
  double y2 = 5;
}

message ArrowClear {
  string page_id = 1;
}

message RadiusUpdate {
  string page_id = 1;
  double x = 2;
  double y = 3;
  double x2 = 4;
  double y2 = 5;
}

message RadiusClear {
  string page_id = 1;
}

message Ping {
  string page_id = 1;
  double x = 2;
  double y = 3;
}

message ViewportSync {
  string page_id = 1;
  double world_center_x = 2;
  double world_center_y = 3;
  double scale = 4;
}

message DiceRollRequest {
  string expression = 1;
  string client_id = 2;
  bool private = 3;
  string player_name = 4;
  string dice_color = 5;
  optional string adv_mode = 6; // "advantage" | "disadvantage"
  string label = 7;
}

message DiceRollResult {
  string expression = 1;
  int32 sides = 2;
  repeated int32 rolls = 3;
  int32 modifier = 4;
  int32 total = 5;
  string client_id = 6;
  bool private = 7;
  string player_name = 8;
  string dice_color = 9;
  string label = 10;
}

// PlayerJoin registers a player's active-character identity (name, color, token
// image) with the server so the DM's player bar can show them. It no longer
// places any token — the DM adds a player's token by clicking them in that bar.
// The server never rebroadcasts PlayerJoin itself; it broadcasts the resulting
// characterUpdate for the active character_id.
message PlayerJoin {
  string player_id = 1;     // durable, browser-stored identity
  string name = 2;
  string color = 3;         // border/dice color
  string token_url = 4;     // chosen token image
  string page_id = 5;       // deprecated: no longer used (join places no token)
  string character_id = 6;  // the player's active character this identity is for
}

// PlayerRemove asks the server to fully evict a player: delete their entire
// character roster and remove every token they own across all pages. The server
// rebroadcasts it so all clients drop the player's tokens and sheets.
message PlayerRemove {
  string player_id = 1;  // durable, browser-stored identity
}

// ── Envelope ─────────────────────────────────────────────────────────────────
// Every message on the wire is an Envelope with exactly one payload set.
// The oneof field name (e.g. "tokenMove") is the discriminator in protojson.
message Envelope {
  oneof payload {
    Hello hello = 1;
    Snapshot snapshot = 2;
    MapSet map_set = 3;
    MapResize map_resize = 4;
    TokenAdd token_add = 5;
    TokenMove token_move = 6;
    TokenRemove token_remove = 7;
    TokenUpdate token_update = 8;
    TokenStatus token_status = 9;
    FogAdd fog_add = 10;
    FogRemove fog_remove = 11;
    FogClear fog_clear = 12;
    PageAdd page_add = 13;
    PageRemove page_remove = 14;
    PageRename page_rename = 15;
    PagePresent page_present = 16;
    ArrowUpdate arrow_update = 17;
    ArrowClear arrow_clear = 18;
    RadiusUpdate radius_update = 19;
    RadiusClear radius_clear = 20;
    Ping ping = 21;
    ViewportSync viewport_sync = 22;
    DiceRollRequest dice_roll_request = 23;
    DiceRollResult dice_roll_result = 24;
    TokenMoveBatch token_move_batch = 25;
    PlayerJoin player_join = 26;
    Character character_update = 27;
    PlayerRemove player_remove = 28;
    HexGridSet hex_grid_set = 29;
    HexGridRemove hex_grid_remove = 30;
  }
}
